# CI 工作流：Android/Kotlin 单元测试 + Lint + Release 编译检查
# 触发：push 到 dev/main 分支、任意 pull_request、以及手动 workflow_dispatch
# 内容：JDK 17 (temurin，开启 Gradle 缓存) + Android SDK，
#       依次执行 :app:testPublicDebugUnitTest（公共版 Debug 单元测试）、:app:lintPublicDebug（Debug Lint）、
#       :app:assemblePublicRelease + :app:assemblePersonalRelease（两个渠道的 Release 编译检查，仅编译不签名不发布）
# 失败时上传测试报告 artifacts，便于定位问题；最小权限（contents: read）
# 说明：不依赖任何 secrets；Release 构建传入占位 YE_COST_SUBSCRIPTION_API_BASE_URL，
#       未提供 keystore 环境变量时签名配置回退为 unsigned
name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 注意：该 action 的默认 packages 为「tools platform-tools」，而 Google 已从 SDK 仓库
      # 移除旧的 `tools` 包 —— 默认值会让 sdkmanager 报 "Failed to find package 'tools'"
      # 并以 exit 1 失败（2026-09-15 起所有 CI 都会红）。这里显式只装仍然存在的包。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Run unit tests and lint
        run: ./gradlew :app:testPublicDebugUnitTest :app:lintPublicDebug --console=plain --no-daemon

      - name: Compile release build (unsigned)
        # 两个渠道都必须能编译：personal 渠道若腐化，这里会立刻暴露
        run: ./gradlew :app:assemblePublicRelease :app:assemblePersonalRelease -PYE_COST_SUBSCRIPTION_API_BASE_URL=https://invalid.local --console=plain --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testPublicDebugUnitTest/**
            app/build/test-results/testPublicDebugUnitTest/**
          if-no-files-found: ignore
