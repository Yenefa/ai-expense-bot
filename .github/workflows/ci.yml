# CI 工作流：Android/Kotlin 单元测试 + Lint
# 触发：push 到 dev/main 分支、任意 pull_request、以及手动 workflow_dispatch
# 内容：JDK 17 (temurin，开启 Gradle 缓存) + Android SDK，
#       执行 :app:testDebugUnitTest（Debug 单元测试）与 :app:lintDebug（Debug Lint）
# 说明：不依赖任何 secrets；Debug 构建未提供订阅 API URL 时走 build.gradle.kts 中的默认回退
name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain --no-daemon
